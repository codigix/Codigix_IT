# Security headers for codigixinfotech.com.
# `include` this in the HTTPS server {} block AND in every location {} block
# that sets its own add_header (nginx drops inherited add_header lines there).

# Browsers use HTTPS only, for a year. Every subdomain (e.g. hrmsystem.) must work on HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# Content-Security-Policy (enforced). Tested in Chrome on every public page and
# /admin with 0 violations. If something new is blocked (browser console:
# "Refused to load ..."), add that exact source below; never add 'unsafe-eval'
# or a wildcard script source. To test a change safely first, rename the header
# to Content-Security-Policy-Report-Only (reports problems, blocks nothing).
# Sources: Google Fonts, Google Tag Manager / Analytics 4 (incl. its
# analytics.google.com, www.google.com and doubleclick collect endpoints),
# YouTube embeds, the HRM demo iframe (ERP pages) and https: images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.co.in; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://hrmsystem.codigixinfotech.com https://www.googletagmanager.com; media-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
