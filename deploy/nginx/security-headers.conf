# Security headers for codigixinfotech.com.
# `include` this in the HTTPS server {} block AND in every location {} block
# that sets its own add_header (nginx drops inherited add_header lines there).

# Browsers use HTTPS only, for a year. Every subdomain (e.g. hrmsystem.) must work on HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# Content-Security-Policy, in report-only mode first: browse the site (including
# /admin) for a day, check the browser console for "[Report Only]" violations,
# add any legitimate source below, then rename the header to
# Content-Security-Policy. Never add 'unsafe-eval' or a wildcard script source.
# Sources: Google Fonts, Google Tag Manager / Analytics, YouTube embeds,
# the HRM demo iframe (ERP pages) and images from Cloudinary/Unsplash (https:).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://hrmsystem.codigixinfotech.com https://www.googletagmanager.com; media-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
