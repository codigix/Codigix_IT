# Example nginx site for codigixinfotech.com (Ubuntu, nginx 1.24).
# Merge into /etc/nginx/sites-enabled/<your-site>, keeping your existing
# ssl_certificate lines (certbot) and /api proxy, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes this repo is deployed at /var/www/codigix (adjust the paths) and
# `npm run build` has produced dist/ with pre-rendered pages:
#   dist/index.html              homepage (pre-rendered)
#   dist/<route>/index.html      every other public page (pre-rendered)
#   dist/app-shell.html          plain SPA shell for all other URLs

# 301s for old ?tab= URLs, renamed hubs and alias routes (generated file)
include /var/www/codigix/deploy/nginx/seo-redirects.conf;

server {
    listen 443 ssl http2;
    server_name codigixinfotech.com www.codigixinfotech.com;

    # ssl_certificate     /etc/letsencrypt/live/codigixinfotech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/codigixinfotech.com/privkey.pem;

    root /var/www/codigix/dist;
    index index.html;

    include /var/www/codigix/deploy/nginx/security-headers.conf;

    if ($codigix_redirect) {
        return 301 $codigix_redirect;
    }

    # One URL per page: /ai-solutions/ -> /ai-solutions
    rewrite ^/(.+)/$ /$1 permanent;

    # Backend API (keep whatever proxy you already have)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # Hashed build assets never change
    location /assets/ {
        include /var/www/codigix/deploy/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pre-rendered page if there is one, otherwise the SPA shell (blog posts, 404s)
    location / {
        include /var/www/codigix/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html /app-shell.html;
    }
}

server {
    listen 80;
    server_name codigixinfotech.com www.codigixinfotech.com;
    return 301 https://codigixinfotech.com$request_uri;
}
